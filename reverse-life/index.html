<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>反面人生</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Layout: 一欄人生帳本。走過的路口在上面，紅色因果線沿左側串起每個年紀；眼前的路口是一排雙面卡片，翻過來就是反面。 */
:root{
  --paper:#E6E9E6;
  --sheet:#F3F4F1;
  --sheet-2:#DADFDC;
  --ink:#182031;
  --ink-2:#4A5367;
  --muted:#6F7787;
  --rule:#C3C9CC;
  --hatch:#D2D7D8;
  --night:#1E2A48;
  --night-ink:#EAEDF5;
  --night-2:#A7B1C8;
  --thread:#B9382B;
  --thread-wash:rgba(185,56,43,.12);
  --display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti",serif;
  --body:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141C;--sheet:#171C26;--sheet-2:#202634;--ink:#DCE1EA;--ink-2:#A9B1C1;--muted:#7F8799;
    --rule:#2C3343;--hatch:#232A38;--night:#E6E3D8;--night-ink:#1A2132;--night-2:#5B6378;
    --thread:#E2604F;--thread-wash:rgba(226,96,79,.16);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141C;--sheet:#171C26;--sheet-2:#202634;--ink:#DCE1EA;--ink-2:#A9B1C1;--muted:#7F8799;
  --rule:#2C3343;--hatch:#232A38;--night:#E6E3D8;--night-ink:#1A2132;--night-2:#5B6378;
  --thread:#E2604F;--thread-wash:rgba(226,96,79,.16);color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 80px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--thread);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow,.k{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted);margin:0;line-height:1.5}

/* masthead: 標題和它從紙背滲過來的反字 */
.mast{display:grid;gap:6px;padding-block:24px 22px;border-bottom:1px solid var(--rule)}
.title{position:relative;isolation:isolate;width:fit-content;margin:0;font-family:var(--display);font-weight:700;font-size:clamp(54px,13vw,96px);line-height:1.08;letter-spacing:.06em}
.title::after{content:attr(data-mirror);position:absolute;inset:0;z-index:-1;transform:scaleX(-1) translate(-.2em,.14em);color:var(--thread);opacity:.18;pointer-events:none;white-space:nowrap}
.tag{margin:6px 0 0;font-family:var(--display);font-size:clamp(18px,3.4vw,22px);color:var(--ink-2)}
.mast.compact{padding-block:14px 14px;grid-template-columns:auto 1fr;align-items:end;gap:6px 16px}
.mast.compact .title{font-size:34px}
.mast.compact .eyebrow{padding-bottom:6px}

/* intro */
.intro{display:grid;gap:26px;padding-top:28px}
.lead{margin:0;font-family:var(--display);font-size:clamp(20px,3.6vw,24px);line-height:1.65;max-width:25em;text-wrap:pretty}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:r;max-width:34em}
.rules li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px}
.rules li::before{counter-increment:r;content:counter(r);font-family:var(--mono);font-size:13px;color:var(--thread);padding-top:3px}
.demo{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.demo figcaption{grid-column:1/-1;font-size:14px;color:var(--muted)}
.d{display:flex;flex-direction:column;gap:6px;padding:14px 14px 16px;border-radius:4px;min-height:118px}
.d .lab{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.35}
.d.yours{border:1px dashed var(--ink-2)}
.d.his{background:var(--night);color:var(--night-ink)}
.d.his .k,.d.his .cap{color:var(--night-2)}
.d.none{border:1px dotted var(--rule);color:var(--muted)}
.setup{display:grid;gap:18px;padding:20px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;max-width:520px}
.field{display:grid;gap:6px;border:0;margin:0;padding:0;min-width:0}
.field label,.field legend{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted);padding:0}
#name-input{font-family:var(--display);font-size:24px;padding:4px 2px;border:0;border-bottom:1.5px solid var(--ink-2);background:transparent;color:var(--ink);width:100%;max-width:12em;border-radius:0}
#name-input:focus{outline:none;border-bottom-color:var(--thread)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{font-family:var(--display);font-size:18px;letter-spacing:0;color:var(--ink);padding:4px 16px;border:1px solid var(--rule);border-radius:3px;cursor:pointer}
.seg input:checked+label{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg input:focus-visible+label{outline:2px solid var(--thread);outline-offset:2px}
.btn{justify-self:start;font-family:var(--display);font-size:19px;padding:9px 22px;border:0;border-radius:3px;background:var(--ink);color:var(--paper);cursor:pointer;transition:background .2s}
.btn:hover{background:var(--thread)}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--ink-2)}
.btn.quiet:hover{background:var(--sheet-2)}

/* status */
.status{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.ages{display:flex;flex-wrap:wrap;gap:2px;list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ages li{padding:1px 6px;border-radius:2px;color:var(--muted)}
.ages li.done{color:var(--ink)}
.ages li.now{background:var(--thread);color:var(--sheet)}
.tally{margin:0;font-size:13px;color:var(--ink-2)}
.tally b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

/* timeline: 紅色因果線 */
.life{list-style:none;margin:0 0 28px;padding:0;position:relative}
.life::before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:2px;background:var(--thread);opacity:.75}
.row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-block:8px 16px;scroll-margin-top:80px}
.knot{width:44px;height:44px;border-radius:50%;border:2px solid var(--thread);background:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:500;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.row-b{min-width:0;padding:4px 10px 6px;margin-left:-10px;border-radius:4px}
.row h3{margin:0;font-family:var(--display);font-size:15px;font-weight:400;color:var(--muted);line-height:1.5}
.row-his{margin:2px 0 0;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.4}
.row-his .who{font-weight:400;color:var(--ink-2);margin-right:.4em}
.row-lived{margin:4px 0 0;font-size:15px;color:var(--ink-2);line-height:1.75;text-wrap:pretty}
.row-yours{margin:6px 0 0;font-size:13px;color:var(--muted)}
.fx{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.fx li{font-size:12.5px;line-height:1.5;padding:2px 8px;border-radius:2px}
.fx li.open{color:var(--thread);border:1px solid var(--thread)}
.fx li.close{color:var(--ink-2);border:1px solid var(--rule);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px)}
.fx-miss{margin:8px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.row.flash .row-b{animation:flash 2s ease-out}
@keyframes flash{0%,35%{background:var(--thread-wash)}100%{background:transparent}}

/* current crossroads */
.node-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.knot.big{width:68px;height:68px;border:0;background:var(--thread);color:var(--sheet);font-size:24px;display:flex;flex-direction:column;justify-content:center;line-height:1}
.knot.big small{font-family:var(--display);font-size:12px;margin-top:3px}
.node h2{margin:0;font-family:var(--display);font-size:clamp(26px,5.4vw,36px);line-height:1.25;text-wrap:balance;scroll-margin-top:24px}
.node h2:focus{outline:none}
.situation{margin:18px 0 20px;font-size:17.5px;line-height:1.9;max-width:34em;text-wrap:pretty}
.prompt-row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.prompt{margin:0;font-family:var(--display);font-size:19px;color:var(--thread);line-height:1.5}
.undo{background:none;border:0;padding:2px 0;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.card{appearance:none;-webkit-appearance:none;margin:0;padding:0;border:0;background:none;text-align:left;cursor:pointer;display:flex;perspective:1100px;border-radius:4px}
.card:disabled{cursor:default}
.inner{flex:1;display:grid;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.25,.8,.25,1)}
.face{grid-area:1/1;display:flex;flex-direction:column;gap:8px;padding:16px 16px 18px;border-radius:4px;min-height:150px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--sheet);border:1px solid var(--rule);transition:border-color .2s,transform .2s}
.card:not(:disabled):hover .front{border-color:var(--ink-2);transform:translateY(-2px)}
.back{transform:rotateY(180deg);justify-content:center;border:1px solid transparent}
.card.flipped .inner{transform:rotateY(180deg)}
.card.is-his .inner,.card.is-none .inner{transition-delay:.18s}
.lab{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.35}
.txt{font-size:15px;color:var(--ink-2);line-height:1.7}
.door-new{display:flex;gap:6px;align-items:baseline;font-size:12.5px;line-height:1.5;color:var(--thread)}
.door-new::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--thread);transform:translateY(-2px)}
.hint{display:none;margin-top:auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--thread)}
.card.is-cand .front{border-style:dashed;border-color:var(--thread)}
.card.is-cand:hover .hint,.card.is-cand:focus-visible .hint{display:block}
.mirror{display:block;transform:scaleX(-1);font-family:var(--display);font-size:22px;font-weight:700;opacity:.45;line-height:1.35}
.cap{font-size:13px;color:var(--muted);line-height:1.5}
.is-yours .back{border:1px dashed var(--ink-2);color:var(--ink-2)}
.is-his .back{background:var(--night);color:var(--night-ink)}
.is-his .back .k,.is-his .back .cap{color:var(--night-2)}
.is-none .back{border:1px dotted var(--rule);color:var(--muted)}
.is-none .back .lab{font-weight:400}

.closed{margin-top:26px}
.closed ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.closed li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:12px 14px;border:1px solid var(--rule);border-radius:4px;background:repeating-linear-gradient(135deg,transparent 0 7px,var(--hatch) 7px 8px)}
.lock{color:var(--muted);padding-top:3px}
.lock svg{display:block;width:16px;height:18px}
.c-lab{margin:0;font-family:var(--display);font-size:18px;color:var(--ink-2);line-height:1.4}
.c-why{margin:2px 0 0;font-size:14px;color:var(--ink-2);line-height:1.7}
.c-why em{font-style:normal;color:var(--thread);margin-left:.4em}
.jump{margin-top:4px;background:none;border:0;padding:0;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink);text-decoration:underline;text-decoration-color:var(--thread);text-underline-offset:3px;cursor:pointer}

.outcome{margin-top:22px;display:grid;gap:12px;padding:22px 22px 20px;border-radius:4px;background:var(--night);color:var(--night-ink);animation:rise .5s .5s both}
.outcome p{margin:0}
.outcome .k{color:var(--night-2)}
.o-lived{font-family:var(--display);font-size:20px;line-height:1.7;text-wrap:pretty}
.o-ghost{display:grid;gap:4px;padding-top:12px;border-top:1px dashed var(--night-2);color:var(--night-2);font-size:15px;line-height:1.75}
.next{justify-self:start;margin-top:4px;font-family:var(--display);font-size:18px;padding:8px 20px;border:0;border-radius:3px;background:var(--night-ink);color:var(--night);cursor:pointer}
.next:hover{background:var(--thread);color:var(--night-ink)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ending */
.end{display:grid;gap:34px;padding-top:30px}
.end-h{margin:0;font-family:var(--display);font-size:clamp(32px,7vw,52px);line-height:1.25;text-wrap:balance}
.end-h:focus{outline:none}
.epi{margin:0;font-size:18px;line-height:2;max-width:34em;text-wrap:pretty}
.whale{position:relative;isolation:isolate;margin:0;padding:24px 0 8px;border-top:1px solid var(--rule)}
.whale .said{margin:8px 0 0;position:relative;width:fit-content;max-width:100%;font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,42px);line-height:1.3}
.whale .said::after{content:attr(data-mirror);position:absolute;inset:0;z-index:-1;transform:scaleX(-1) translate(-.16em,.12em);color:var(--thread);opacity:.16;pointer-events:none}
.lives{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.lives section{padding:20px;border-radius:4px;min-width:0}
.lives h3{margin:0;font-family:var(--display);font-size:22px}
.lives .sub{margin:2px 0 12px;font-size:13px}
.lives ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lives li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;font-size:15px;line-height:1.6}
.lives .a{font-family:var(--mono);font-size:12.5px;padding-top:2px;font-variant-numeric:tabular-nums}
.life-his{background:var(--night);color:var(--night-ink)}
.life-his .sub,.life-his .a{color:var(--night-2)}
.life-yours{border:1px dashed var(--ink-2);color:var(--ink-2)}
.life-yours .sub,.life-yours .a{color:var(--muted)}
.block h3{margin:0 0 10px;font-family:var(--display);font-size:24px}
.block p{margin:0 0 10px;max-width:36em}
.c-stats{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;max-width:36em}
.c-stats li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px}
.c-stats b{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.3;color:var(--thread);font-variant-numeric:tabular-nums}
.insight{font-family:var(--display);font-size:20px;color:var(--thread)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 14px;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:6px}
.legend .chip{padding:0;width:22px;height:14px}
.map-rows{display:grid;gap:8px}
.m-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.m-row .a{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;line-height:1.5;padding:2px 9px;border-radius:2px;border:1px solid transparent}
.chip.his{background:var(--night);color:var(--night-ink)}
.chip.yours{border:1px dashed var(--ink-2);color:var(--ink-2)}
.chip.none{border:1px dotted var(--muted);color:var(--muted)}
.chip.locked{color:var(--muted);border-color:var(--rule);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--hatch) 5px 6px)}
.chip svg{width:10px;height:12px}
.record summary{cursor:pointer;font-family:var(--display);font-size:20px;padding-block:6px}
.record .life{margin-top:16px}
.coda{display:grid;gap:6px;padding-top:24px;border-top:1px solid var(--rule)}
.coda p{margin:0;font-family:var(--display);font-size:clamp(19px,3.6vw,23px);line-height:1.75;max-width:26em}
.end-actions{display:flex;flex-wrap:wrap;gap:10px}

@media (prefers-reduced-motion: reduce){
  .inner,.front{transition:none}
  .outcome,.row.flash .row-b{animation:none}
}
.node.instant .inner,.node.instant .front{transition:none!important}
.node.instant .outcome{animation:none}
</style>

<div class="wrap"><main id="app"></main></div>

<script>
(() => {
'use strict';

/* ---------- 人生的路口 ----------
   每個選項：label 卡片標題、card 卡片說明、lived 角色走了之後發生的事、sets 留下的因果標記。
   req 需要全部標記、reqAny 需要任一標記、block 有任一標記就關門、blockCount 標記累積到門檻就關門。
   complain 標記「抱怨」類的選項，用來在結尾算帳。 */
const NODES = [
{age:7, title:'撕破的鯨魚',
 text:'美術課，{名}畫了一整節課的鯨魚。下課前，隔壁的阿哲一把把它撕成了兩半。',
 options:[
  {id:'tell', complain:true, label:'跟老師告狀', card:'哭著去找老師，大聲說這不公平。', lived:'老師罰阿哲站了一整節課。{名}學到一件事：委屈要說出來，才會有人管。', sets:['voice','grumble']},
  {id:'why', label:'問阿哲為什麼', card:'走到阿哲面前問：你為什麼要撕？', lived:'阿哲說，因為他沒有藍色的筆。{名}把自己的分給他一半。後來他們天天一起回家。', sets:['friend']},
  {id:'redraw', label:'回家重畫一張', card:'一句話都不說，回家畫一張更大的。', lived:'新的鯨魚被老師貼在教室後面。{名}發現，畫畫可以把難過變成別的東西。', sets:['draw']},
 ]},
{age:13, title:'沒有人要的那一組',
 text:'分組報告，大家很快就湊好了隊。最後只剩{名}一個人，站在講台旁邊。',
 options:[
  {id:'complain', complain:true, label:'跟老師抱怨', card:'跟老師說：大家都故意不找我。', lived:'老師把{名}硬塞進一組。那組人表面客氣，私下從來不找{他}。', sets:['grumble']},
  {id:'alone', label:'一個人做完', card:'不找了，自己一個人做完整份報告。', lived:'{名}一個人拿了全班最高分。也是從那時候起，{他}開始覺得什麼事都自己來比較快。', sets:['solo']},

const find = (row, id) => (row.opts.find(x => x.o.id === id) || {}).o;

function resolve(node, ctx){
  if (!node.variants) return node;
  return node.variants.find(v => !v.when || v.when(ctx));
}

function run(){
  const tags = new Map();
  const counts = {grumble: []};
  const ctx = {tags, counts, has: t => tags.has(t)};
  const rows = [];
  const n = Math.min(NODES.length, S.hist.length + 1);
  for (let i = 0; i < n; i++){
    const node = resolve(NODES[i], ctx);
    const row = {i, age: NODES[i].age, title: node.title,
      text: typeof node.text === 'function' ? node.text(ctx) : node.text,
      opts: [], entry: S.hist[i] || null, effects: []};
    rows.push(row);
    row.opts = node.options.map(o => ({o, g: gate(o, ctx, rows)}));
    for (const {o, g} of row.opts){
      if (g.src != null && g.kind !== 'base') rows[g.src].effects.push({kind: g.open ? 'open' : 'close', via: g.via, age: row.age, label: o.label});
    }
    if (row.entry){
      const his = find(row, row.entry.his);
      if (!his) break;
      for (const t of his.sets || []){
        if (!tags.has(t)) tags.set(t, i);
        if (counts[t]) counts[t].push(i);
      }
    }
  }
  END = ctx;
  return rows;
}

function gate(o, ctx, rows){
  for (const t of o.block || []){
    if (ctx.tags.has(t)){
      const r = rows[ctx.tags.get(t)];
      return {open: false, kind: 'closed', via: 'tag', src: r.i, why: `${r.age} 歲時，{他}${q(hisOf(r).label)}。`, tail: '那是你反對的路'};
    }
  }
  for (const [t, n] of Object.entries(o.blockCount || {})){
    const list = ctx.counts[t] || [];
    if (list.length >= n){
      const r = rows[list[list.length - 1]];
      return {open: false, kind: 'closed', via: 'tag', src: r.i, why: `{他}已經抱怨過 ${list.length} 次（${list.map(k => rows[k].age).join('、')} 歲）。`, tail: o.note || ''};
    }
  }
  const need = (o.req || []).filter(t => !ctx.tags.has(t));
  if (need.length) return missing(need, rows);
  let key = null;
  if (o.reqAny){
    key = o.reqAny.find(t => ctx.tags.has(t));
    if (!key) return missing(o.reqAny, rows);
  } else if (o.req && o.req.length){
    key = o.req.reduce((a, t) => ctx.tags.get(t) > ctx.tags.get(a) ? t : a);
  }
  if (key){
    const r = rows[ctx.tags.get(key)];
    return {open: true, kind: 'opened', via: 'tag', src: r.i, why: `因為 ${r.age} 歲${q(hisOf(r).label)}`};
  }
  return {open: true, kind: 'base', src: null};
}

// 找出是哪個路口沒走、這扇門才沒打開
function missing(list, rows){
  let locked = null;
  for (const r of rows){
    if (!r.entry) continue;
    for (const {o, g} of r.opts){
      if (o.id === r.entry.his || !(o.sets || []).some(t => list.includes(t))) continue;
      if (!g.open){ locked = locked || {r, o, g}; continue; }
      const mine = o.id === r.entry.yours;
      return {open: false, kind: 'closed', via: 'miss', src: r.i, why: `${r.age} 歲時，{他}沒有${q(o.label)}。`, tail: mine ? '因為那是你選的' : '那條路沒有人走'};
    }
  }
  if (locked){
    const {r, o, g} = locked;
    return {open: false, kind: 'closed', via: g.via || 'miss', src: g.src != null ? g.src : r.i, why: `${r.age} 歲時，${q(o.label)}那扇門也關著。${g.why}`, tail: g.tail};
  }
  return {open: false, kind: 'closed', via: 'miss', src: null, why: '{他}的路上，從來沒有出現過能打開這扇門的選擇。', tail: ''};
}

/* ---------- state ---------- */
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function adopt(d){
  if (!d || typeof d !== 'object') return;
  if (typeof d.name === 'string' && d.name.trim()) S.name = d.name.trim().slice(0, 8);
  if (PRONOUNS.includes(d.pron)) S.pron = d.pron;
  if (['intro', 'play', 'end'].includes(d.phase)) S.phase = d.phase;
  if (Array.isArray(d.hist)) S.hist = d.hist.filter(e => e && typeof e.his === 'string').map(e => ({yours: typeof e.yours === 'string' ? e.yours : null, his: e.his}));
  if (d.pending && typeof d.pending === 'object') S.pending = {yours: typeof d.pending.yours === 'string' ? d.pending.yours : null, his: typeof d.pending.his === 'string' ? d.pending.his : null, auto: !!d.pending.auto};
}

// 內容改版後，丟掉對不上的紀錄
function sanitize(){
  const all = S.hist.slice(0, NODES.length);
  const ok = [];
  for (const e of all){
    S.hist = ok;
    const row = run()[ok.length];
    const open = row.opts.filter(x => x.g.open).map(x => x.o.id);
    if (!open.includes(e.his)) break;
    if (e.yours != null && (!open.includes(e.yours) || e.yours === e.his)) break;
    ok.push(e);
  }
  S.hist = ok;
  const P = S.pending;
  if (P && ok.length < NODES.length){
    const open = run()[ok.length].opts.filter(x => x.g.open).map(x => x.o.id);
    const bad = (P.yours != null && !open.includes(P.yours)) || (P.his != null && !open.includes(P.his)) || (P.yours == null && P.his == null) || (P.yours != null && P.yours === P.his);
    if (bad) S.pending = null;
  } else S.pending = null;
  if (S.phase === 'end' && ok.length < NODES.length) S.phase = ok.length ? 'play' : 'intro';
  if (S.phase === 'play' && ok.length >= NODES.length) S.phase = 'end';
}

      <div class="d his"><span class="k">你最反對的</span><span class="lab">跟老師告狀</span><span class="cap">${L('{名}走了這條')}</span></div>

function statusBar(){
  const i = S.hist.length;
  let closed = 0, opened = 0;
  for (const r of ROWS) for (const {g} of r.opts){ if (!g.open) closed++; else if (g.kind === 'opened') opened++; }
  return `<div class="status">
    <ol class="ages" aria-label="人生進度">${NODES.map((n, k) => `<li class="${k < i ? 'done' : k === i ? 'now' : ''}"${k === i ? ' aria-current="step"' : ''}>${n.age}</li>`).join('')}</ol>
    <p class="tally">走過 <b>${i}</b> 個路口 · 打開 <b>${opened}</b> 扇門 · 關上 <b>${closed}</b> 扇門</p>
  </div>`;
}

function rowHTML(r){
  const his = hisOf(r);
  const yours = r.entry.yours ? find(r, r.entry.yours) : null;
  const direct = r.effects.filter(e => e.via === 'tag');
  const missed = r.effects.filter(e => e.via !== 'tag');
  const fx = (direct.length ? `<ul class="fx">${direct.map(e => `<li class="${e.kind}">${e.age} 歲${e.kind === 'open' ? '打開' : '關上'}${T(q(e.label))}</li>`).join('')}</ul>` : '')
    + (missed.length ? `<p class="fx-miss">沒走的路，後來讓 ${missed.length} 扇門沒有打開：${missed.map(e => T(q(e.label))).join('')}</p>` : '');
  return `<li class="row" id="row-${r.i}">
    <div class="knot"><span>${r.age}</span></div>
    <div class="row-b">
      <h3>${r.age} 歲 · ${T(r.title)}</h3>
      <p class="row-his"><span class="who">${T('{名}')}</span>${T(his.label)}</p>
      <p class="row-lived">${T(his.lived)}</p>
      <p class="row-yours">${yours ? `你選的是${T(q(yours.label))}` : '這一次，只剩一條路。'}</p>
      ${fx}
    </div>
  </li>`;
}

function cardHTML({o, g}){
  return `<button class="card" type="button" data-act="card" data-id="${o.id}">
    <span class="inner">
      <span class="face front">
        ${g.kind === 'opened' ? `<span class="door-new">${T(g.why)}</span>` : ''}
        <span class="lab">${T(o.label)}</span>
        <span class="txt">${T(o.card)}</span>
        <span class="hint">${T('選這條，{他}就走這條')}</span>
      </span>
      <span class="face back"></span>
    </span>
  </button>`;
}

function closedHTML(shut){
  return `<section class="closed" aria-label="關著的門">
    <p class="eyebrow">關著的門 · ${shut.length}</p>
    <ul>${shut.map(({o, g}) => `<li>
      <span class="lock">${LOCK}</span>
      <div>
        <p class="c-lab">${T(o.label)}</p>
        <p class="c-why">${T(g.why)}${g.tail ? `<em>${T(g.tail)}</em>` : ''}</p>
        ${g.src != null ? `<button class="jump" type="button" data-act="jump" data-row="${g.src}">回到 ${ROWS[g.src].age} 歲那一天</button>` : ''}
      </div>
    </li>`).join('')}</ul>
  </section>`;
}

function play(){
  const row = ROWS[S.hist.length];
  const open = row.opts.filter(x => x.g.open);
  const shut = row.opts.filter(x => !x.g.open);
  const past = ROWS.filter(r => r.entry);
  return `<section class="game">
    ${statusBar()}
    ${past.length ? `<ol class="life">${past.map(rowHTML).join('')}</ol>` : ''}
    <article class="node" id="node">
      <header class="node-h">
        <div class="knot big"><span>${row.age}</span><small>歲</small></div>
        <h2 id="node-h" tabindex="-1">${T(row.title)}</h2>
      </header>
      <p class="situation">${T(row.text)}</p>
      <div class="prompt-row"><p class="prompt" id="prompt" aria-live="polite"></p><button class="undo" type="button" data-act="undo" hidden>改選</button></div>
      <div class="cards">${open.map(cardHTML).join('')}</div>
      ${shut.length ? closedHTML(shut) : ''}
      <div class="outcome" id="outcome" hidden></div>
    </article>
  </section>`;
}

function backHTML(o, role, P){
  if (role === 'yours') return `<span class="k">你選的</span><span class="mirror" aria-hidden="true">${T(o.label)}</span><span class="cap">${T('{他}不會走這條')}</span>`;
  if (role === 'his') return `<span class="k">${T('{名}走了這條')}</span><span class="lab">${T(o.label)}</span><span class="cap">${P.yours == null ? '唯一開著的一條' : P.auto ? '你沒選的那條' : '你最反對的那條'}</span>`;
  if (role === 'none') return `<span class="k">沒有人走</span><span class="lab">${T(o.label)}</span>`;
  return '';
}

function updateNode(instant){
  const node = document.getElementById('node');
  if (!node) return;
  const row = ROWS[S.hist.length];
  const P = S.pending || {};
  const openCount = row.opts.filter(x => x.g.open).length;
  if (instant) node.classList.add('instant');

  node.querySelectorAll('.card').forEach(btn => {
    const id = btn.dataset.id;
    const o = find(row, id);
    let role = '';
    if (P.his) role = id === P.his ? 'his' : id === P.yours ? 'yours' : 'none';
    else if (P.yours) role = id === P.yours ? 'yours' : 'cand';
    btn.className = 'card' + (role ? ' is-' + role : '') + (role && role !== 'cand' ? ' flipped' : '');
    btn.disabled = !!P.his || role === 'yours';
    btn.querySelector('.back').innerHTML = backHTML(o, role, P);
    const name = plain(o.label);
    btn.setAttribute('aria-label',
      role === 'cand' ? `最反對：${name}。${plain(o.card)}`
      : role === 'yours' ? `你選的：${name}`
      : role === 'his' ? `${S.name}走了這條：${name}`
      : role === 'none' ? `沒有人走：${name}`
      : `${name}。${plain(o.card)}`);
  });

  document.getElementById('prompt').innerHTML = T(
    P.his ? (P.yours == null ? '只剩一條路，{名}走了過去。' : P.auto ? '你沒選的那條，{名}走了。' : '你最反對的那條，{名}走了。')
    : P.yours ? '{名}不會走你那條。剩下的路裡，你最反對哪一條？'
    : openCount === 1 ? '只剩一條路開著。不管你說什麼，{他}都只能走這條。'
    : '換作是你，你會怎麼做？');
  node.querySelector('.undo').hidden = !(P.yours && !P.his);

  const out = document.getElementById('outcome');
  if (P.his){
    const his = find(row, P.his);
    const yours = P.yours ? find(row, P.yours) : null;
    const last = S.hist.length === NODES.length - 1;
    out.innerHTML = `
      <p class="k">${row.age} 歲 · ${T('{名}')}${T(q(his.label))}</p>
      <p class="o-lived">${T(his.lived)}</p>
      ${yours ? `<div class="o-ghost"><p class="k">如果${T('{他}')}聽你的，${T(q(yours.label))}</p><p>${T(yours.lived)}</p></div>` : `<div class="o-ghost"><p>這一次，你沒有選擇的餘地。</p></div>`}
      <button class="next" type="button" data-act="next">${last ? '看完這一生' : `往 ${NODES[S.hist.length + 1].age} 歲走`}</button>`;
    out.hidden = false;
    if (!instant) setTimeout(() => out.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: 'nearest'}), RM ? 0 : 700);
  } else {
    out.hidden = true;
    out.innerHTML = '';
  }
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => node.classList.remove('instant')));
}

/* ---------- ending ---------- */
function epilogue(has, g){
  const s = ['{名}活到了七十歲。'];
  if (has('restart')) s.push('三十八歲那年，{他}把一切收起來重新開始。第二段日子比較慢，也比較像自己。');
  else if (has('book')) s.push('{他}畫的那本《撕破的鯨魚》，放在很多小孩的床頭。');
  else if (has('shop')) s.push(has('team') ? '巷子口那間店還開著，阿哲煮的咖啡還是一樣苦。' : '那間店還開著，招牌換過好幾次。');
  else if (has('hualien')) s.push('花蓮的海，每天早上照樣把{他}叫醒。');
  else if (has('abroad')) s.push('{他}去過很遠的地方，也在那裡學會了開口求助。');
  else if (has('freelance')) s.push('{他}一直靠畫畫過日子，不算富有，但每天都知道要畫什麼。');
  else s.push('{他}在同一個地方待了很多年，日子安安靜靜地過去。');
  if (has('partner')) s.push('小禾一直在{他}身邊。');
  else if (has('missed')) s.push('{他}一個人過，偶爾還會想起那場婚禮上的燈。');
  if (has('mended')) s.push('{他}和爸爸，最後是站在同一邊的。');
  else if (has('rift')) s.push('那句對不起，{他}到最後都沒有說出口。');
  else if (has('care')) s.push('爸爸最後那幾年，是{名}陪著走完的。');
  else if (has('distance')) s.push('爸爸到最後，還是常在視訊裡問{他}什麼時候回來。');
  if (has('walk')) s.push('七十歲了，{他}每天還是走八千步。');
  else if (has('rest')) s.push('五十二歲那年，{他}終於學會了休息。');
  else if (has('sick')) s.push('抽屜裡的報告一年比一年厚。');
  if (has('teach') || has('listener')) s.push('那個來敲門的年輕人，後來常常回來看{他}。');
  if (g === 0) s.push('{他}這輩子幾乎沒有抱怨過。');
  else if (g <= 2) s.push(`{他}抱怨過 ${g} 次，抱怨完，還是去把事情做了。`);
  else s.push(`{他}抱怨過 ${g} 次。後來的人說起{他}，第一句常常是：「喔，那個很愛抱怨的人。」`);
  return s.join('');
}

const uniq = list => [...new Set(list)];

function ending(){
  const rows = ROWS;
  const has = t => END.tags.has(t);
  const g = END.counts.grumble.length;
  const words = hisOf(rows[rows.length - 1]).words || '';

  let total = 0, nHis = 0, nYours = 0, nNone = 0, nLocked = 0;
  for (const r of rows) for (const {o, g: gt} of r.opts){
    total++;
    if (!gt.open) nLocked++;
    else if (o.id === r.entry.his) nHis++;
    else if (o.id === r.entry.yours) nYours++;
    else nNone++;
  }

  const comp = [];
  for (const r of rows) for (const x of r.opts) if (x.o.complain) comp.push({r, o: x.o, g: x.g});
  const cHis = comp.filter(c => c.o.id === c.r.entry.his);
  const cYours = comp.filter(c => c.o.id === c.r.entry.yours);
  const cNone = comp.filter(c => c.g.open && c.o.id !== c.r.entry.his && c.o.id !== c.r.entry.yours);
  const closedBy = uniq(cHis.flatMap(c => c.r.effects.filter(e => e.kind === 'close' && e.via === 'tag').map(e => e.label)));
  const openedBy = uniq(cHis.flatMap(c => c.r.effects.filter(e => e.kind === 'open' && e.via === 'tag').map(e => e.label)));
  const missedBy = uniq(cHis.flatMap(c => c.r.effects.filter(e => e.via !== 'tag').map(e => e.label)));
  const insight = cHis.length >= 3 ? '你越用力反對抱怨，抱怨就越常落到{他}身上。'
    : cYours.length >= 4 ? '你把抱怨都留給了自己，{他}就只能往別的地方走。'
    : '抱怨每個路口都在。它會關上一些門，有時候也會打開一些。';

  const chip = (r, o, gt) => {
    const cls = !gt.open ? 'locked' : o.id === r.entry.his ? 'his' : o.id === r.entry.yours ? 'yours' : 'none';
    return `<span class="chip ${cls}">${cls === 'locked' ? LOCK : ''}${T(o.label)}</span>`;
  };

  return `<section class="end">
    <div>
      <p class="eyebrow">${T('{名}')} · 七十歲</p>
      <h2 class="end-h" id="end-h" tabindex="-1">${T('你最反對的，就是{名}的一生。')}</h2>
    </div>
    <p class="epi">${T(epilogue(has, g))}</p>

    <figure class="whale">
      <p class="eyebrow">寫在鯨魚反面的話</p>
      <p class="said" data-mirror="${esc(words)}">${esc(words)}</p>
    </figure>

    <div class="lives">
      <section class="life-his">
        <h3>${T('{名}活的那一生')}</h3>
        <p class="sub">每一條，都是你反對的路</p>
        <ol>${rows.map(r => `<li><span class="a">${r.age}</span><span>${T(hisOf(r).label)}</span></li>`).join('')}</ol>
      </section>
      <section class="life-yours">
        <h3>你選的那一生</h3>
        <p class="sub">沒有發生過</p>
        <ol>${rows.map(r => `<li><span class="a">${r.age}</span><span>${r.entry.yours ? T(find(r, r.entry.yours).label) : '（只剩一條路）'}</span></li>`).join('')}</ol>
      </section>
    </div>

    <section class="block">
      <h3>關於抱怨</h3>
      <p>這一生，「抱怨」出現在 ${comp.length} 個路口。</p>
      <ul class="c-stats">
        <li><b>${cHis.length}</b><span>${T('次你反對抱怨，{名}就抱怨了。')}</span></li>
        <li><b>${cYours.length}</b><span>${T('次你自己選了抱怨，那幾次{名}都去做了別的事。')}</span></li>
        <li><b>${cNone.length}</b><span>次抱怨就放在那裡，你們誰都沒有碰。</span></li>
      </ul>
      ${closedBy.length || openedBy.length ? `<p>${T('{名}那幾次抱怨，')}${closedBy.length ? `後來關上了${closedBy.map(l => T(q(l))).join('')}` : ''}${closedBy.length && openedBy.length ? '；' : ''}${openedBy.length ? `也打開了${openedBy.map(l => T(q(l))).join('')}` : ''}。</p>` : ''}
      ${missedBy.length ? `<p>${T(`抱怨的時候，{他}就沒有走別條路。因為這樣，後來還有 ${missedBy.length} 扇門一直沒有打開。`)}</p>` : ''}
      <p class="insight">${T(insight)}</p>
    </section>

    <section class="block">
      <h3>這一生所有的路</h3>
      <p>${T(`一共出現過 ${total} 條路。{名}走了 ${nHis} 條，你選了 ${nYours} 條，${nNone} 條沒有人走，還有 ${nLocked} 扇門是關著的。`)}</p>
      <ul class="legend">
        <li><span class="chip his"></span>${T('{名}走的')}</li>
        <li><span class="chip yours"></span>你選的</li>
        <li><span class="chip none"></span>沒有人走</li>
        <li><span class="chip locked"></span>關著的門</li>
      </ul>
      <div class="map-rows">${rows.map(r => `<div class="m-row"><span class="a">${r.age}</span><div class="chips">${r.opts.map(({o, g: gt}) => chip(r, o, gt)).join('')}</div></div>`).join('')}</div>
    </section>

    <details class="record">
      <summary>完整的因果紀錄</summary>
      <ol class="life">${rows.map(rowHTML).join('')}</ol>
    </details>

    <section class="coda">
      <p>每個路口都不只一條路。</p>
      <p>你選了一條，反面就有人走另一條。還有一些路，你們兩個都沒有看一眼。</p>
      <p>下次覺得只剩一條路、只能抱怨的時候，把這一頁翻過來，看看反面。</p>
    </section>

    <div class="end-actions">
      <button class="btn" type="button" data-act="again">${T('讓{名}再活一次')}</button>
      <button class="btn quiet" type="button" data-act="rename">換一個人</button>
    </div>
  </section>`;
}

/* ---------- render & actions ---------- */
function render(focus){
  ROWS = run();
  app.innerHTML = mast(S.phase !== 'intro') + (S.phase === 'intro' ? intro() : S.phase === 'play' ? play() : ending());
  if (S.phase === 'play') updateNode(true);
  if (focus){
    const h = document.getElementById(S.phase === 'end' ? 'end-h' : 'node-h');
    if (h){
      h.focus({preventScroll: true});
      if (S.phase === 'end') window.scrollTo({top: 0, behavior: RM ? 'auto' : 'smooth'});
      else h.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: 'start'});
    }
  }
}

function choose(id){
  const row = ROWS[S.hist.length];
  const open = row.opts.filter(x => x.g.open).map(x => x.o.id);
  if (!open.includes(id)) return;
  const P = S.pending;
  if (P && P.his) return;
  if (open.length === 1) S.pending = {yours: null, his: id, auto: false};
  else if (!P){
    const rest = open.filter(x => x !== id);
    S.pending = {yours: id, his: rest.length === 1 ? rest[0] : null, auto: rest.length === 1};
  } else {
    if (id === P.yours) return;
    P.his = id;
  }
  save();
  updateNode(false);
}

function commit(){
  const P = S.pending;
  if (!P || !P.his) return;
  S.hist.push({yours: P.yours, his: P.his});
  S.pending = null;
  if (S.hist.length >= NODES.length) S.phase = 'end';
  save();
  render(true);
}

function jump(i){
  const el = document.getElementById('row-' + i);
  if (!el) return;
  el.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: 'center'});
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function restart(phase){
  S.hist = [];
  S.pending = null;
  S.phase = phase;
  save();
  render(phase === 'play');
  if (phase === 'intro') window.scrollTo(0, 0);
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !app.contains(b)) return;
  const a = b.dataset.act;
  if (a === 'card') choose(b.dataset.id);
  else if (a === 'undo'){ S.pending = null; save(); updateNode(false); }
  else if (a === 'next') commit();
  else if (a === 'jump') jump(+b.dataset.row);
  else if (a === 'again') restart('play');
  else if (a === 'rename') restart('intro');
  else if (a === 'resume'){ S.phase = 'play'; save(); render(true); }
});

app.addEventListener('submit', e => {
  if (e.target.id !== 'setup') return;
  e.preventDefault();
  const v = document.getElementById('name-input').value.trim();
  S.name = (v || DEFAULT_NAME).slice(0, 8);
  restart('play');
});

function onField(e){
  if (e.target.id === 'name-input'){
    S.name = (e.target.value.trim() || DEFAULT_NAME).slice(0, 8);
    app.querySelectorAll('.nm').forEach(n => { n.textContent = S.name; });
  } else if (e.target.name === 'pron' && PRONOUNS.includes(e.target.value)){
    S.pron = e.target.value;
    app.querySelectorAll('.pr').forEach(n => { n.textContent = S.pron; });
  } else return;
  save();
}
app.addEventListener('input', onField);
app.addEventListener('change', onField);

function boot(data){
  if (data && data.S) adopt(data.S);
  else { try { adopt(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {} }
  sanitize();
  render(false);
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function'){
  try { hot.snapshot(() => ({S: JSON.parse(JSON.stringify(S))})); } catch (e) {}
}
if (hot && typeof hot.ready === 'function') hot.ready(boot);
else boot(hot && hot.data ? hot.data : {});
})();
</script>

</body>
</html>
