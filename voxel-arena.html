<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel 競技場</title>
    <meta name="claude:viewport-fit-sides" content="cover">
    <style>
        * { box-sizing: border-box; }
        :root { color-scheme: dark; }
        [hidden] { display: none !important; }
        html { height: 100%; }
        body {
            margin: 0;
            background: #141820;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        /* 鎖定與原圖完全一致的 16:9 畫布比例，確保構圖落點 100% 對齊 */
        #viewport-wrap {
            position: relative;
            width: min(100%, calc(90vh * 1.714));
            aspect-ratio: 1200 / 700;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        /* 左上角夕陽暖光特效 */
        #sun-flare {
            position: absolute;
            top: -18%;
            left: -12%;
            width: 55%;
            height: 75%;
            background: radial-gradient(circle, rgba(255,250,205,0.75) 0%, rgba(255,205,110,0.32) 38%, rgba(255,180,80,0) 70%);
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 2;
        }
        /* 原圖疊加比對層 */
        #overlay-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            transition: opacity 0.1s;
        }
        /* 控制列 */
        #toolbar {
            margin-top: 12px;
            max-width: 100%;
            background: rgba(30, 36, 48, 0.9);
            padding: 8px 16px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px 14px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        button, label.btn {
            background: #e76f51;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        button:hover, label.btn:hover { background: #f4845f; }
        button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        button.secondary { background: #3b82f6; }
        button.secondary:hover { background: #60a5fa; }
        input[type="range"] { width: 90px; cursor: pointer; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="viewport-wrap">
        <div id="sun-flare"></div>
        <img id="overlay-img" alt="原圖比對層" />
    </div>

    <div id="toolbar">
        <span>🖱️ 左鍵旋轉 ｜ 滾輪縮放 ｜ 右鍵平移</span>
        <button id="resetCamBtn">🎯 鎖定原圖 1:1 機位</button>
        <button id="shotBtn" class="secondary">📸 下載目前畫面截圖 (PNG)</button>
        <label class="btn" style="background:#4b5563;">
            🖼️ 載入原圖疊加比對
            <input type="file" id="uploadRef" accept="image/*">
        </label>
        <span id="opacityCtrl" style="display:none; align-items:center; gap:6px;">
            原圖透明度: <input type="range" id="alphaSlider" min="0" max="1" step="0.05" value="0.45">
        </span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        const container = document.getElementById('viewport-wrap');

        // =====================================================
        // 1. 場景與精準原圖機位 (1200:700 畫幅對齊)
        // =====================================================
        const scene = new THREE.Scene();

        // 背景天空漸層
        const skyCanvas = document.createElement('canvas');
        skyCanvas.width = 2; skyCanvas.height = 512;
        const sCtx = skyCanvas.getContext('2d');
        const skyGrad = sCtx.createLinearGradient(0, 0, 0, 512);
        skyGrad.addColorStop(0, '#7cc2f2');
        skyGrad.addColorStop(0.45, '#bfe6fa');
        skyGrad.addColorStop(1, '#eef5dc');
        sCtx.fillStyle = skyGrad;
        sCtx.fillRect(0, 0, 2, 512);
        scene.background = new THREE.CanvasTexture(skyCanvas);
        scene.fog = new THREE.FogExp2(0xb6e1f5, 0.0082);

        const camera = new THREE.PerspectiveCamera(30, 1200 / 700, 0.1, 350);
        // 精準逆向計算出的相機座標與凝視點
        const CAM_POS = new THREE.Vector3(0.0, 23.2, 34.0);
        const CAM_TARGET = new THREE.Vector3(0.0, 0.4, -1.2);
        camera.position.copy(CAM_POS);

        // preserveDrawingBuffer: true 確保可隨時擷取 Canvas 產生真實截圖
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.copy(CAM_TARGET);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.update();

        // =====================================================
        // 2. 光影系統 (左上角陽光斜射、向右前方拉出柔和陰影)
        // =====================================================
        const hemiLight = new THREE.HemisphereLight(0xe4f5ff, 0xa88256, 0.9);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffe399, 2.35);
        sunLight.position.set(-28, 22, -16);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 5;
        sunLight.shadow.camera.far = 95;
        const d = 26;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0004;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x9fd0ff, 0.45);
        fillLight.position.set(18, 14, 24);
        scene.add(fillLight);

        // =====================================================
        // 3. 體素方塊幾何與材質庫
        // =====================================================
        const boxGeo = new RoundedBoxGeometry(1, 1, 1, 2, 0.035);

        function createVoxelMat(hex, roughness = 0.86) {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const ctx = c.getContext('2d');
            const col = new THREE.Color(hex);
            ctx.fillStyle = '#' + col.getHexString();
            ctx.fillRect(0, 0, 64, 64);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, 62, 62);
            const tex = new THREE.CanvasTexture(c);
            return new THREE.MeshStandardMaterial({ map: tex, roughness, metalness: 0.02 });
        }

        // 繪製原圖燕尾紅旗與金色城堡圖騰
        function makeBannerTex() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.beginPath();
            ctx.moveTo(14, 10);
            ctx.lineTo(242, 10);
            ctx.lineTo(242, 496);
            ctx.lineTo(128, 412);
            ctx.lineTo(14, 496);
            ctx.closePath();

            const g = ctx.createLinearGradient(0, 0, 256, 512);
            g.addColorStop(0, '#dc1f18');
            g.addColorStop(1, '#9e0e0a');
            ctx.fillStyle = g;
            ctx.fill();

            ctx.lineWidth = 14;
            ctx.strokeStyle = '#f5bc2c';
            ctx.stroke();

            // 黃色城堡圖騰
            ctx.fillStyle = '#fbd03c';
            ctx.beginPath();
            ctx.moveTo(76, 295);
            ctx.lineTo(180, 295);
            ctx.lineTo(164, 175);
            ctx.lineTo(92, 175);
            ctx.closePath();
            ctx.fill();
            ctx.fillRect(68, 280, 120, 22);
            // 三個城垛
            ctx.fillRect(84, 145, 22, 34);
            ctx.fillRect(117, 145, 22, 34);
            ctx.fillRect(150, 145, 22, 34);
            // 雙窗孔
            ctx.fillStyle = '#a1120d';
            ctx.fillRect(119, 192, 18, 22);
            ctx.fillRect(116, 236, 24, 38);

            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const mats = {
            sand: [
                createVoxelMat(0xefa960),
                createVoxelMat(0xe8a055),
                createVoxelMat(0xe2974c),
                createVoxelMat(0xf4b26a)
            ],
            grass: [
                createVoxelMat(0x7eb93a),
                createVoxelMat(0x74ae31),
                createVoxelMat(0x87c343),
                createVoxelMat(0x6ba429)
            ],
            moss: createVoxelMat(0x88b644),
            skull: [
                createVoxelMat(0xebe8e2),
                createVoxelMat(0xe1ded7),
                createVoxelMat(0xd6d3cb)
            ],
            stone: [
                createVoxelMat(0xa8a7a3),
                createVoxelMat(0x979691),
                createVoxelMat(0xb6b5b0),
                createVoxelMat(0x898883)
            ],
            brazier: createVoxelMat(0x42403d, 0.7),
            black: new THREE.MeshBasicMaterial({ color: 0x121212 }),
            wood: createVoxelMat(0x6e451f, 0.9),
            leaves: [
                createVoxelMat(0x5a9c2c),
                createVoxelMat(0x4e8c23),
                createVoxelMat(0x6bae3a),
                createVoxelMat(0x7bbc46)
            ],
            tuft: new THREE.MeshStandardMaterial({ color: 0x457d1e, roughness: 0.8 }),
            gold: new THREE.MeshStandardMaterial({ color: 0xf5c230, roughness: 0.35, metalness: 0.4 }),
            vistaRock: new THREE.MeshStandardMaterial({ color: 0x7b9fb8, roughness: 0.95 }),
            vistaGrass: new THREE.MeshStandardMaterial({ color: 0x70a55a, roughness: 0.95 }),
            fireOuter: new THREE.MeshBasicMaterial({ color: 0xff5500 }),
            fireMid: new THREE.MeshBasicMaterial({ color: 0xffaa00 }),
            fireCore: new THREE.MeshBasicMaterial({ color: 0xffffaa })
        };

        function pick(arr, seed) {
            if (!Array.isArray(arr)) return arr;
            const idx = Math.abs(Math.floor(Math.sin(seed * 91.7) * 43758.5453)) % arr.length;
            return arr[idx];
        }

        // 建立深綠長草叢
        function addGrassTuft(wx, wy, wz, scale = 1) {
            const g = new THREE.Group();
            g.position.set(wx, wy, wz);
            for (let i = 0; i < 4; i++) {
                const b = new THREE.Mesh(boxGeo, mats.tuft);
                const h = (0.48 + (i % 2) * 0.18) * scale;
                b.scale.set(0.14 * scale, h, 0.14 * scale);
                const a = (i / 4) * Math.PI * 2 + 0.3;
                b.position.set(Math.cos(a) * 0.16 * scale, h / 2, Math.sin(a) * 0.16 * scale);
                b.rotation.z = Math.cos(a) * 0.16;
                b.rotation.x = Math.sin(a) * 0.16;
                b.castShadow = true;
                g.add(b);
            }
            scene.add(g);
        }

        // =====================================================
        // 4. 地面 1:1 像素字元地圖 (精確對應原圖 28 度斜角與鋸齒邊界)
        // =====================================================
        // 'S' = 沙地廣場與小徑, 'G' = 草地, 'H' = 外圍墊高草坡
        const TERRAIN_MAP = [
            "HHHHHHHHHHHHHHHHHHHHHHHHGGSSSSSSSS", // z = -15 (遠方小徑出口)
            "HHHHHHHHHHHHHHHHHHHHHHHGGGSSSSSSGH",
            "HHHHHHHHHHHHHHHHHHHHHHGGGSSSSSGGHH",
            "HHHHHHHHHHHHHHHHHHHHHGGGSSSSSGGGHH",
            "HHHHHHHHHHHHHHHHHHHHGGGSSSSSGGGGHH",
            "HHHHHHHHHHHHHHHHHHHGGGSSSSSSGGGGHH",
            "HHHHHHHHHHHGGGGGGGGGGSSSSSSSGGGGHH",
            "HHHHHHHHHGGGGGGGGSSSSSSSSSSSGGGGHH",
            "HHHHHHHHGGGGGGSSSSSSSSSSSSSSGGGGHH", // 後方火炬台連線區
            "HHHHHHHGGGGGSSSSSSSSSSSSSSSSGGGGHH",
            "HHHHHHGGGGGSSSSSSSSSSSSSSSSSGGGGHH",
            "HHHHHGGGGGSSSSSSSSSSSSSSSSSSSGGGHH",
            "HHHHGGGGGSSSSSSSSSSSSSSSSSSSSSGGHH", // 骷髏頭前緣與沙徑交界
            "HHHGGGGGSSSSSSSSSSSSSSSSSSSSSSSGGH",
            "HHGGGGGSSSSSSSSSSSSSSSSSSSSSSSSGGH",
            "HGGGGGSSSSSSSSSSSSSSSSSSSSSSSSSGGH", // 廣場中段最寬處
            "HGGGGSSSSSSSSSSSSSSSSSSSSSSSSSSGGH",
            "GGGGSSSSSSSSSSSSSSSSSSSSSSSSSSSGGH",
            "GGGGSSSSSSSSSSSSSSSSSSSSSSSSSSGGGH",
            "GGGGSSSSSSSSSSSSSSSSSSSSSSSSSGGGGH",
            "GGGGGSSSSSSSSSSSSSSSSSSSSSSSGGGGGH", // 左下與右下草地開始內縮
            "GGGGGGSSSSSSSSSSSSSSSSSSSSSGGGGGGH",
            "GGGGGGGSSSSSSSSSSSSSSSSSSSGGGGGGGH",
            "GGGGGGGGSSSSSSSSSSSSSSSSSGGGGGGGGH",
            "GGGGGGGGGSSSSSSSSSSSSSSSGGGGGGGGGH",
            "GGGGGGGGGGSSSSSSSSSSSSSGGGGGGGGGGH",
            "GGGGGGGGGGGSSSSSSSSSSSGGGGGGGGGGGH", // 正下方底部沙地尖角
            "GGGGGGGGGGGGSSSSSSSSSGGGGGGGGGGGGH"  // z = +12 (鏡頭最前緣)
        ];

        const GRID_ANGLE = -0.46; // 約 -26.5 度，讓磚塊斜率與原圖完全一致
        const groundGroup = new THREE.Group();
        groundGroup.rotation.y = GRID_ANGLE;
        scene.add(groundGroup);

        const rows = TERRAIN_MAP.length;
        const cols = TERRAIN_MAP[0].length;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const gx = c - 16.5;
                const gz = r - 14.5;
                const ch = TERRAIN_MAP[r][c];
                const isSand = (ch === 'S');

                const tile = new THREE.Mesh(boxGeo, pick(isSand ? mats.sand : mats.grass, r * 37 + c * 13));
                tile.position.set(gx, -0.5, gz);
                tile.receiveShadow = true;
                groundGroup.add(tile);

                if (ch === 'H') {
                    const topTile = new THREE.Mesh(boxGeo, pick(mats.grass, r * 19 + c));
                    topTile.position.set(gx, 0.5, gz);
                    topTile.castShadow = true;
                    topTile.receiveShadow = true;
                    groundGroup.add(topTile);
                }
            }
        }

        // 補充外圍延伸草地避免邊角露空
        for (let r = -6; r < rows + 6; r++) {
            for (let c = -8; c < cols + 8; c++) {
                if (r >= 0 && r < rows && c >= 0 && c < cols) continue;
                const gx = c - 16.5;
                const gz = r - 14.5;
                const tile = new THREE.Mesh(boxGeo, pick(mats.grass, r * 41 + c * 23));
                tile.position.set(gx, -0.5, gz);
                tile.receiveShadow = true;
                groundGroup.add(tile);
            }
        }

        // =====================================================
        // 5. 左上角：白色骷髏頭遺跡 + 左右石坡 + 小紅旗 (1:1 落點)
        // =====================================================
        function buildExactSkull() {
            const g = new THREE.Group();
            // 精準鎖定在畫面左上角座標
            g.position.set(-7.8, 0, -2.8);
            g.rotation.y = -GRID_ANGLE + 0.15; // 面向右下方廣場中心
            scene.add(g);

            function addVoxel(x, y, z, matArr, sx = 1, sy = 1, sz = 1) {
                const m = new THREE.Mesh(boxGeo, pick(matArr, x * 17 + y * 31 + z * 13));
                m.position.set(x, y + sy / 2, z);
                m.scale.set(sx, sy, sz);
                m.castShadow = true;
                m.receiveShadow = true;
                g.add(m);
            }

            // 1. 底部口腔黑影與 4 顆內縮門牙
            addVoxel(0, 0, 0.9, mats.black, 3.6, 1.1, 1.6);
            [-1.25, -0.42, 0.42, 1.25].forEach(tx => {
                addVoxel(tx, 0, 1.75, mats.skull, 0.66, 1.0, 0.8);
            });

            // 2. 眼窩與鼻腔內部黑底
            addVoxel(0, 1.0, 1.0, mats.black, 3.8, 2.8, 1.4);

            // 3. 骷髏頭 5x4x4 體素雕刻
            for (let y = 1; y <= 4; y++) {
                for (let x = -2; x <= 2; x++) {
                    for (let z = -1; z <= 2; z++) {
                        if (y === 4 && Math.abs(x) === 2 && z === 2) continue;
                        if (z === 2) {
                            // 左右眼窩挖空
                            if (y === 2 && (x === -1 || x === 1)) continue;
                            // 中央鼻孔挖空
                            if (y === 1 && x === 0) continue;
                        }
                        // 頭頂與右側青苔塊
                        const moss = (y === 4 && ((x === -1 && z === 1) || (x === 1 && z === 1))) ||
                                     (y === 3 && x === 2 && z === 1);
                        addVoxel(x, y, z, moss ? mats.moss : mats.skull);
                    }
                }
            }
            // 倒 T 型鼻孔上方窄縫細節
            addVoxel(-0.34, 1.0, 2.0, mats.skull, 0.34, 1.0, 1.0);
            addVoxel(0.34, 1.0, 2.0, mats.skull, 0.34, 1.0, 1.0);
            // 頭頂圓拱加高層與青苔
            addVoxel(-0.4, 5.0, 0.4, mats.skull, 2.2, 0.5, 2.2);
            addVoxel(0.9, 5.0, 1.1, mats.moss, 1.0, 0.5, 1.0);

            // 4. 骷髏右側階梯狀灰石護坡 (連接至沙地邊緣)
            const rightSlope = [
                [3, 0, 1.4, 1, 2.8, 1, false], [3, 0, 0.4, 1, 3.6, 1, true],
                [4, 0, 1.2, 1, 2.0, 1, false], [4, 0, 0.2, 1, 2.7, 1, false],
                [5, 0, 1.0, 1, 1.1, 1, false], [5, 0, 0.0, 1, 1.8, 1, false]
            ];
            rightSlope.forEach(([rx, ry, rz, sx, sy, sz, moss]) => {
                addVoxel(rx, ry, rz, moss ? mats.moss : mats.stone, sx, sy, sz);
            });

            // 5. 骷髏左側灰石牆與左下角斜插小紅旗
            const leftSlope = [
                [-3, 0, 1.4, 1, 3.0, 1], [-3, 0, 0.4, 1, 3.6, 1],
                [-4, 0, 1.4, 1, 2.1, 1], [-4, 0, 0.4, 1, 2.6, 1]
            ];
            leftSlope.forEach(([lx, ly, lz, sx, sy, sz]) => {
                addVoxel(lx, ly, lz, mats.stone, sx, sy, sz);
            });

            // 小紅旗 (帶木質立桿與頂部橫桿)
            const miniFlag = new THREE.Group();
            miniFlag.position.set(-3.2, 0, 2.35);
            miniFlag.rotation.z = 0.15;
            miniFlag.rotation.y = -0.15;
            g.add(miniFlag);

            const poleV = new THREE.Mesh(boxGeo, mats.wood);
            poleV.scale.set(0.16, 2.3, 0.16);
            poleV.position.set(0.65, 1.15, 0);
            miniFlag.add(poleV);

            const poleH = new THREE.Mesh(boxGeo, mats.wood);
            poleH.scale.set(1.5, 0.16, 0.16);
            poleH.position.set(0, 2.05, 0);
            miniFlag.add(poleH);

            const fPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(1.15, 1.75),
                new THREE.MeshStandardMaterial({ map: makeBannerTex(), transparent: true, side: THREE.DoubleSide })
            );
            fPlane.position.set(-0.05, 1.18, 0.08);
            fPlane.castShadow = true;
            miniFlag.add(fPlane);
        }
        buildExactSkull();

        // 骷髏周圍草叢點綴
        addGrassTuft(-5.0, 0, -1.2, 1.1);
        addGrassTuft(-4.3, 0, -2.1, 0.95);
        addGrassTuft(-9.8, 0, 0.2, 1.1);
        addGrassTuft(-8.9, 0, 0.8, 1.0);
        addGrassTuft(-11.0, 0, 1.2, 1.05);

        // =====================================================
        // 6. 中央偏右：階梯狀金字塔巨石山 (沙徑左側地標)
        // =====================================================
        function buildCenterRightMountain() {
            const g = new THREE.Group();
            // 鎖定在沙地廣場右上方、彎曲沙徑左側
            g.position.set(4.5, 0, -4.6);
            g.rotation.y = -GRID_ANGLE;
            scene.add(g);

            // 精確對照原圖的階梯狀高度分佈 (前低後高、左低右高)
            const blocks = [
                [-1, 1, 1.1], [0, 1, 2.1], [1, 1, 1.6],
                [-1, 0, 2.4], [0, 0, 4.0], [1, 0, 3.0], [2, 0, 1.6],
                [-1, -1, 3.5], [0, -1, 5.5], [1, -1, 4.4], [2, -1, 2.6],
                [0, -2, 6.7], [1, -2, 5.2], [2, -2, 3.4]
            ];
            blocks.forEach(([bx, bz, bh]) => {
                const m = new THREE.Mesh(boxGeo, pick(mats.stone, bx * 19 + bz * 31));
                m.position.set(bx * 0.96, bh / 2, bz * 0.96);
                m.scale.set(0.98, bh, 0.98);
                m.castShadow = true;
                m.receiveShadow = true;
                g.add(m);
            });
        }
        buildCenterRightMountain();
        addGrassTuft(3.2, 0, -3.5, 1.15);
        addGrassTuft(5.2, 0, -2.9, 1.15);

        // =====================================================
        // 7. 右側邊緣：巨型高塔、大燕尾紅旗與前景亂石堆
        // =====================================================
        function buildRightBorderTower() {
            const g = new THREE.Group();
            // 精準鎖定在畫面最右側邊緣
            g.position.set(11.4, 0, -1.8);
            g.rotation.y = -0.38;
            scene.add(g);

            function addPart(x, y, z, matArr, sx = 1, sy = 1, sz = 1) {
                const m = new THREE.Mesh(boxGeo, pick(matArr, x * 29 + y * 43 + z * 11));
                m.position.set(x, y + sy / 2, z);
                m.scale.set(sx, sy, sz);
                m.castShadow = true;
                m.receiveShadow = true;
                g.add(m);
            }

            // 高聳主塔身 (直衝畫面頂部邊緣)
            for (let y = 0; y < 13; y++) {
                for (let x = -1.5; x <= 1.5; x++) {
                    for (let z = -1.5; z <= 1.5; z++) {
                        addPart(x, y, z, mats.stone);
                    }
                }
            }

            // 塔底前側石堆與畫面右下角獨立石塊群
            const rocks = [
                [-1.4, 0, 2.2, 1.1, 3.2, 1.1],
                [-0.2, 0, 2.3, 1.3, 4.4, 1.3],
                [1.0, 0, 2.2, 1.2, 3.6, 1.2],
                [-2.2, 0, 1.6, 1.0, 2.0, 1.0],
                [-1.8, 0, 2.8, 0.9, 1.2, 0.9],
                // 右下角前景岩石叢
                [0.2, 0, 4.5, 1.2, 2.3, 1.2],
                [1.3, 0, 4.3, 1.2, 3.0, 1.2],
                [0.8, 0, 5.4, 1.1, 1.6, 1.1],
                [1.8, 0, 5.1, 1.0, 1.9, 1.0]
            ];
            rocks.forEach(([rx, ry, rz, sx, sy, sz]) => {
                addPart(rx, ry, rz, mats.stone, sx, sy, sz);
            });

            // 頂部橫向木桿與金球
            addPart(0, 10.8, 2.15, mats.wood, 3.1, 0.22, 0.22);
            addPart(-1.65, 10.72, 2.15, mats.gold, 0.38, 0.38, 0.38);
            addPart(1.65, 10.72, 2.15, mats.gold, 0.38, 0.38, 0.38);

            // 巨型紅底黃堡壘燕尾旗
            const banner = new THREE.Mesh(
                new THREE.PlaneGeometry(2.7, 5.0),
                new THREE.MeshStandardMaterial({ map: makeBannerTex(), transparent: true, side: THREE.DoubleSide, roughness: 0.55 })
            );
            banner.position.set(0, 8.3, 2.18);
            banner.castShadow = true;
            g.add(banner);
        }
        buildRightBorderTower();

        addGrassTuft(8.8, 0, 0.1, 1.15);
        addGrassTuft(9.8, 0, 0.7, 1.0);
        addGrassTuft(10.0, 0, 2.6, 1.15);
        addGrassTuft(11.1, 0, 3.5, 1.0);

        // =====================================================
        // 8. 後方雙火炬石台與斷垣殘壁 (精準對齊原圖上方邊界)
        // =====================================================
        const flames = [];
        function buildTorch(wx, wz) {
            const g = new THREE.Group();
            g.position.set(wx, 0, wz);
            g.rotation.y = -GRID_ANGLE;
            scene.add(g);

            const pillar = new THREE.Mesh(boxGeo, pick(mats.stone, wx * 17));
            pillar.scale.set(1.35, 2.5, 1.35);
            pillar.position.set(0, 1.25, 0);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            g.add(pillar);

            const pan = new THREE.Mesh(boxGeo, mats.brazier);
            pan.scale.set(1.55, 0.55, 1.55);
            pan.position.set(0, 2.7, 0);
            pan.castShadow = true;
            g.add(pan);

            const fo = new THREE.Mesh(boxGeo, mats.fireOuter);
            fo.position.set(0, 3.35, 0);
            g.add(fo);

            const fm = new THREE.Mesh(boxGeo, mats.fireMid);
            fm.position.set(0, 3.3, 0.08);
            g.add(fm);

            const fc = new THREE.Mesh(boxGeo, mats.fireCore);
            fc.position.set(0, 3.2, 0.14);
            g.add(fc);

            flames.push({ fo, fm, fc, phase: Math.random() * 10 });

            const light = new THREE.PointLight(0xff7711, 6, 9);
            light.position.set(wx, 3.9, wz);
            scene.add(light);
        }

        // 左火炬台與右火炬台
        buildTorch(-1.9, -8.6);
        buildTorch(2.1, -8.2);

        // 火炬台旁的高低石牆遺跡
        const ruinWalls = [
            [-3.8, -7.8, 1.8], [-3.0, -8.4, 3.1], [-2.4, -8.8, 2.3],
            [-0.9, -8.8, 1.9], [-0.1, -9.0, 1.2],
            [1.1, -8.5, 1.7], [3.0, -7.8, 2.5], [3.7, -7.2, 3.3]
        ];
        ruinWalls.forEach(([wx, wz, wh]) => {
            const m = new THREE.Mesh(boxGeo, pick(mats.stone, wx * 29));
            m.position.set(wx, wh / 2, wz);
            m.scale.set(1.0, wh, 1.0);
            m.rotation.y = -GRID_ANGLE;
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
        });
        addGrassTuft(-2.8, 0, -7.4, 1.05);
        addGrassTuft(-1.1, 0, -8.0, 1.05);
        addGrassTuft(1.2, 0, -7.6, 1.05);

        // =====================================================
        // 9. 方塊樹木與遠景藍綠色階梯群山
        // =====================================================
        function buildVoxelTree(wx, wy, wz, trunkH = 2.4, scale = 1.0) {
            const g = new THREE.Group();
            g.position.set(wx, wy, wz);
            g.rotation.y = -GRID_ANGLE;
            scene.add(g);

            const trunk = new THREE.Mesh(boxGeo, mats.wood);
            trunk.scale.set(0.85 * scale, trunkH, 0.85 * scale);
            trunk.position.set(0, trunkH / 2, 0);
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            g.add(trunk);

            const layers = [
                { y: trunkH + 0.4, r: 1 },
                { y: trunkH + 1.25, r: 1 },
                { y: trunkH + 2.05, r: 0 }
            ];
            layers.forEach(({ y, r }, idx) => {
                for (let lx = -r; lx <= r; lx++) {
                    for (let lz = -r; lz <= r; lz++) {
                        if (idx === 0 && Math.abs(lx) === 1 && Math.abs(lz) === 1) continue;
                        const leaf = new THREE.Mesh(boxGeo, pick(mats.leaves, lx * 17 + lz * 31 + idx));
                        leaf.scale.set(0.95 * scale, 0.95 * scale, 0.95 * scale);
                        leaf.position.set(lx * 0.88 * scale, y, lz * 0.88 * scale);
                        leaf.castShadow = true;
                        leaf.receiveShadow = true;
                        g.add(leaf);
                    }
                }
            });
        }

        // 左側骷髏旁兩棵前景樹 + 骷髏右後方圓冠樹
        buildVoxelTree(-11.4, 0, -0.5, 2.0, 1.08);
        buildVoxelTree(-10.4, 0.6, -2.9, 2.3, 1.18);
        buildVoxelTree(-4.8, 0.4, -6.5, 2.9, 1.18);
        // 遠景樹林
        buildVoxelTree(-14.0, 1.0, -5.2, 2.5, 1.2);
        buildVoxelTree(-8.2, 1.0, -9.2, 2.4, 1.1);
        buildVoxelTree(8.4, 0.5, -9.8, 2.3, 1.0);
        buildVoxelTree(11.2, 0.5, -7.8, 2.1, 0.95);

        // 遠景天際線山峰
        function buildMountain(cx, cz, rad, maxH) {
            const g = new THREE.Group();
            g.position.set(cx, -1, cz);
            g.rotation.y = -GRID_ANGLE;
            scene.add(g);
            for (let x = -rad; x <= rad; x += 2) {
                for (let z = -rad; z <= rad; z += 2) {
                    const dist = Math.hypot(x, z);
                    if (dist < rad) {
                        const h = Math.max(2, Math.floor((1 - dist / rad) * maxH));
                        const m = new THREE.Mesh(boxGeo, mats.vistaRock);
                        m.scale.set(2.05, h, 2.05);
                        m.position.set(x, h / 2, z);
                        g.add(m);

                        const top = new THREE.Mesh(boxGeo, mats.vistaGrass);
                        top.scale.set(2.08, 1.0, 2.08);
                        top.position.set(x, h + 0.5, z);
                        g.add(top);
                    }
                }
            }
        }
        buildMountain(-16, -24, 10, 15);
        buildMountain(-1, -27, 12, 19);
        buildMountain(13, -24, 11, 17);
        buildMountain(25, -18, 9, 13);

        // =====================================================
        // 10. 工具列互動：重置視角、下載真實截圖、疊加原圖比對
        // =====================================================
        document.getElementById('resetCamBtn').addEventListener('click', () => {
            camera.position.copy(CAM_POS);
            controls.target.copy(CAM_TARGET);
            controls.update();
        });

        // 一鍵將 WebGL 畫面存成 PNG 截圖
        // 發佈成 Artifact 時改走 downloads 能力 (會跳出儲存確認)；本機直接開檔則用一般下載連結
        const shotBtn = document.getElementById('shotBtn');
        const downloadsReady = window.claude?.use ? window.claude.use('downloads') : Promise.resolve(undefined);
        downloadsReady.then(dl => { if (dl === null) shotBtn.hidden = true; });

        shotBtn.addEventListener('click', async () => {
            renderer.render(scene, camera);
            const downloads = await downloadsReady;
            if (downloads) {
                const blob = await new Promise(resolve => renderer.domElement.toBlob(resolve, 'image/png'));
                try {
                    await downloads.save({ filename: 'voxel_arena_screenshot.png', data: blob });
                } catch (err) {
                    if (!['declined', 'rate_limited'].includes(err?.code)) shotBtn.hidden = true;
                }
                return;
            }
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'voxel_arena_screenshot.png';
            link.href = dataURL;
            link.click();
        });

        // 載入原圖進行半透明疊圖比對
        const uploadInput = document.getElementById('uploadRef');
        const overlayImg = document.getElementById('overlay-img');
        const opacityCtrl = document.getElementById('opacityCtrl');
        const alphaSlider = document.getElementById('alphaSlider');

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            overlayImg.src = URL.createObjectURL(file);
            overlayImg.style.opacity = alphaSlider.value;
            opacityCtrl.style.display = 'inline-flex';
        });

        alphaSlider.addEventListener('input', (e) => {
            overlayImg.style.opacity = e.target.value;
        });

        window.addEventListener('resize', () => {
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            flames.forEach(f => {
                const w = Math.sin(t * 11 + f.phase) * 0.14;
                f.fo.scale.set(0.75 - w * 0.2, 0.95 + w, 0.75 - w * 0.2);
                f.fm.scale.set(0.52, 0.72 + w * 0.8, 0.52);
                f.fc.scale.set(0.32, 0.45 + w * 0.5, 0.32);
            });
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
